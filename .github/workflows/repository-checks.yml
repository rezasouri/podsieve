name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lightweight-checks:
    name: Syntax, documentation and dependency-free tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile source and tests
        run: python -m compileall -q run.py src ui tests
      - name: Check relative Markdown links
        run: python scripts/check_docs_links.py
      - name: Run lightweight runtime and storage regression tests
        run: python -m unittest discover -s tests -p 'test_runtime.py' -v && python -m unittest discover -s tests -p 'test_ui_storage.py' -v
