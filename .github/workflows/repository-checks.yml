name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lightweight-checks:
    name: Syntax, documentation and dependency-free tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Compile source and tests
        run: python -m compileall -q run.py src ui tests
      - name: Check relative Markdown links
        run: python scripts/check_docs_links.py
      - name: Install minimal test dependency
        run: python -m pip install 'PyYAML==6.0.3'
      - name: Run lightweight runtime and storage regression tests
        run: python -m unittest discover -s tests -p 'test_runtime.py' -v && python -m unittest discover -s tests -p 'test_ui_storage.py' -v

  desktop-ui-tests:
    name: Headless Qt UI and bridge tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: offscreen
      QT_QUICK_BACKEND: software
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install FFmpeg and Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libopengl0 libxkbcommon-x11-0
      - name: Install headless UI test dependencies
        run: python -m pip install 'PySide6>=6.7,<7' 'PyYAML==6.0.3' 'python-dotenv>=1,<2' 'numpy==2.2.6' 'soundfile==0.13.1' 'scipy==1.15.3'
      - name: Run desktop UI regression tests
        run: python -m unittest discover -s tests -p 'test_ui*.py' -v
