[project]
name = "podsieve"
version = "0.1.0"
description = "Local speaker diarization and vocal separation with a Qt desktop UI and Python CLI"
keywords = ["speaker-diarization", "audio-processing", "vocal-separation", "pyannote", "qt", "cli"]
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "audio-separator[gpu]==0.44.2",
    "huggingface-hub==1.14.0",
    "librosa==0.11.0",
    "lightning==2.5.1",
    "numpy==2.2.6",
    "onnx-weekly==1.22.0.dev20260615",
    "onnx2torch-py313==1.6.0",
    "onnxruntime-gpu==1.23.2",
    "protobuf==6.33.6",
    "pyannote-audio==4.0.1",
    "pyside6>=6.7,<7",
    "python-dotenv>=1.0,<2.0",
    "PyYAML==6.0.3",
    "requests==2.33.1",
    "rich>=15.0.0,<16.0.0",
    "scipy==1.15.3",
    "secretstorage>=3.5.0; sys_platform == 'linux'",
    "silero-vad==6.2.1",
    "soundfile==0.13.1",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchcodec==0.7.0",
    "torchvision==0.23.0",
    "tqdm==4.67.3",
    "yt-dlp[default]>=2026.8.19",
]

[tool.uv]
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchcodec = [
    { index = "pytorch-cu128", marker = "sys_platform == 'linux'" },
    { index = "pypi", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
explicit = true
