[project]
name = "podsieve"
version = "0.1.0"
description = "Audio ingestion, source separation, and speaker diarization pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "PyYAML==6.0.3",
    "requests==2.33.1",
    "yt-dlp==2026.3.17",
    "audio-separator[gpu]==0.44.2",
    "torch==2.8.0",
    "torchaudio==2.8.0",
    "torchvision==0.23.0",
    "torchcodec==0.7.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchcodec = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
